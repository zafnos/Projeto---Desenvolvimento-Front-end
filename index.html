<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#217a57">
  <title>Localiza Unipê — Mapa interativo do campus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!--Cabeçalho do site com título e subtítulo -->
  <header class="cabecalho">
    <div class="marca">
      <h1>Localiza Unipê</h1>
      <p>Mapa interativo do campus</p>
    </div>

    <!-- <Nav> Navegação principal. -->
    <nav>
      <ul class="nav-links">
        <li><a href="#">Mapa</a></li>
        <li><a href="#">Sobre</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <section class="pesquisa" aria-label="Pesquisa de prédios">
      <label for="busca-predio">Buscar prédio</label>
      <input id="busca-predio" type="search" placeholder="Digite o nome do prédio" autocomplete="off"
        aria-controls="resultados-predios" aria-describedby="estado-pesquisa">
      <ul id="resultados-predios" class="resultados" aria-label="Resultados da pesquisa"></ul>
      <p id="estado-pesquisa" class="estado" role="status" aria-live="polite"></p>
    </section>

    <div class="area-mapa">
      <svg id="mapa" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa ilustrado do campus UNIPÊ"></svg>
      <aside id="painel-local" class="painel-local" aria-labelledby="local-titulo" hidden>
        <button id="fechar-painel" class="fechar-painel" type="button" aria-label="Fechar informações">×</button>
        <span id="local-categoria" class="local-categoria"></span>
        <h2 id="local-titulo">Informações do local</h2>
        <p id="local-descricao"></p>
        <ul id="local-info"></ul>
      </aside>
    </div>
  </main>

  <footer class="rodape">
    <p><strong>Localiza Unipê</strong> — Mapa interativo do campus UNIPÊ</p>
    <p>Projeto acadêmico — 2026</p>
  </footer>

  <!-- Arquivos JavaScript separados do projeto. -->
  <script src="campus-data.js"></script>
  <script src="campus-map.js"></script>
  <script src="campus-descricoes.js"></script>
  <script src="app.js"></script>
</body>

</html>
