<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa do Campus – UNIPÊ</title><style>html,body{margin:0;height:100%;background:#dfe6ea}
#mapa{width:100vw;height:100vh;display:block;cursor:grab;touch-action:none;user-select:none}
#mapa.arrastando{cursor:grabbing}
/* cada prédio tem UM elemento clicável: <g class="predio" id="predio-biblioteca" data-id data-nome ...> */
#mapa .predio{cursor:pointer;outline:none}
#mapa .hit{fill:transparent;stroke:none}
#mapa .predio:hover .hit,#mapa .predio:focus-visible .hit{fill:rgba(255,255,255,.28);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
#mapa .predio.ativo .hit{fill:rgba(255,226,120,.38);stroke:#fff;stroke-width:1.6;stroke-linejoin:round}</style></head><body>
<svg id="mapa" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa ilustrado do campus UNIPÊ"></svg>
<script src="campus-data.js"></script>
<script src="campus-map.js"></script>
<script>
const svg = document.getElementById('mapa');
const mapa = CampusMap.render(svg, CAMPUS_DATA, {
  rotacao: 22,
  // predio = { id, nome, quadra, inclui, centro, bbox, el }  (null = clicou fora de qualquer prédio)
  onClick: (predio, evento) => {
    if (!predio) return;                 // aqui o responsável pelo site abre o painel / modal
    console.log('clicou em', predio.id, '→', predio.nome);
    mapa.focar(predio.id, { zoom: 3 });  // opcional: aproxima com animação
  },
  onHover: predio => { svg.setAttribute('aria-label', predio ? predio.nome : 'Mapa ilustrado do campus UNIPÊ'); },
});
window.mapa = mapa; // para testar no console: mapa.predios, mapa.focar('biblioteca'), mapa.selecionar('reitoria')
</script>
</body></html>
